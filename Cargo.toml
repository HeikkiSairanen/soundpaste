[workspace]
members = ["crates/modem-core", "crates/cli", "crates/wasm"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

# Signaalinkäsittelytestit ovat tuskallisen hitaita ilman optimointia.
[profile.dev]
opt-level = 2

[profile.test]
opt-level = 2

[profile.release]
opt-level = 3

# Selainversio: ei pinon purkua paniikissa (pienempi binääri), koko ohjelman optimointi.
[profile.wasm]
inherits = "release"
panic = "abort"
lto = true
codegen-units = 1
