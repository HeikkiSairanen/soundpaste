[workspace]
members = ["crates/modem-core", "crates/cli", "crates/wasm"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

# Signal-processing tests are painfully slow without optimization.
[profile.dev]
opt-level = 2

[profile.test]
opt-level = 2

[profile.release]
opt-level = 3

# Browser build: no unwinding on panic (smaller binary), whole-program optimization.
[profile.wasm]
inherits = "release"
panic = "abort"
lto = true
codegen-units = 1
