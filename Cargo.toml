[workspace]
members = ["crates/modem-core", "crates/cli"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

# Signaalinkäsittelytestit ovat tuskallisen hitaita ilman optimointia.
[profile.dev]
opt-level = 2

[profile.test]
opt-level = 2

[profile.release]
opt-level = 3
